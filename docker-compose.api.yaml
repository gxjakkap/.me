services:
  api:
    image: ghcr.io/gxjakkap/dotme-api:latest
    pull_policy: always
    restart: unless-stopped
    labels:
      com.centurylinklabs.watchtower.enable: "true"
    env_file: .env
    environment:
      NODE_ENV: production
      PORT: 3000

  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel run
    env_file: .env
